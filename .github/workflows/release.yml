# Tags and publishes a GitHub release for every push to main that contains a
# feat, fix, perf or breaking-change commit. No CHANGELOG file, no PyPI
# publish: see .releaserc.json.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SEMANTIC_RELEASE_VERSION: 25.0.9
  CONVENTIONALCOMMITS_VERSION: 8.0.0

jobs:
  release:
    # GitHub-hosted: this repository is public, so no self-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs all tags and history

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@${SEMANTIC_RELEASE_VERSION}
          -p conventional-changelog-conventionalcommits@${CONVENTIONALCOMMITS_VERSION}
          semantic-release
